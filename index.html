<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wales &amp; Mauritius Honeymoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: travel-app shell. Home = full-bleed landscape hero, journey timeline, two destination cards.
   Each destination = banner + sticky section bar (Overview, Itinerary, Activities, Food, To-do, Packing, Getting around, Essentials). */
:root {
  --bg: #ffffff;
  --surface: #f3f6f5;
  --card: #ffffff;
  --fg: #1b2424;
  --muted: #5a6968;
  --line: #e0e6e5;
  --accent: #0e7c7b;
  --accent-soft: #e1f1f0;
  --accent-ink: #ffffff;
  --sun: #b87514;
  --sun-soft: #fbf0dc;
  --moss: #3d6b47;
  --moss-soft: #e5eee6;
  --coral: #cf4a46;
  --coral-soft: #fbe6e5;
  --shadow: 0 1px 2px rgba(20,40,40,.06), 0 8px 24px rgba(20,40,40,.08);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 18px;
  --topbar: 61px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1515; --surface: #172020; --card: #1a2424; --fg: #e9f1f0; --muted: #9bb0ae; --line: #2a3838;
    --accent: #3fb8b2; --accent-soft: #163130; --accent-ink: #062020;
    --sun: #f0b45a; --sun-soft: #2f2616; --moss: #8cc196; --moss-soft: #1b2b1f; --coral: #f08a87; --coral-soft: #3a1f1e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1515; --surface: #172020; --card: #1a2424; --fg: #e9f1f0; --muted: #9bb0ae; --line: #2a3838;
  --accent: #3fb8b2; --accent-soft: #163130; --accent-ink: #062020;
  --sun: #f0b45a; --sun-soft: #2f2616; --moss: #8cc196; --moss-soft: #1b2b1f; --coral: #f08a87; --coral-soft: #3a1f1e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; min-height: var(--topbar); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; color: var(--accent); letter-spacing: -.02em; text-decoration: none; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.mainnav { display: flex; gap: 4px; flex: 1; justify-content: center; }
.navbtn { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 14.5px; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.navbtn:hover { background: var(--surface); color: var(--fg); }
.navbtn[aria-current="true"] { color: var(--fg); background: var(--surface); }
.navbtn svg { width: 18px; height: 18px; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok .dot { background: var(--accent); }
.sync.local .dot { background: var(--sun); }
.bottom { display: none; }
@media (max-width: 760px) {
  :root { --topbar: 54px; }
  .top .mainnav { display: none; }
  .top .wrap { justify-content: space-between; padding-block: 10px; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--bg); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
  .bottom .navbtn { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 10px; border-radius: 10px; }
  .bottom .navbtn[aria-current="true"] { color: var(--accent); background: none; }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 25px; }
}

main { padding-block: 0 56px; }
.view { display: grid; gap: 32px; }
.head { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.on-photo { color: #ffffff; opacity: .92; }

.hero { position: relative; border-radius: 0 0 28px 28px; overflow: hidden; min-height: 380px; display: grid; align-items: end; color: #ffffff; }
.hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,30,35,0) 35%, rgba(10,30,35,.55) 100%); }
.hero .inner { position: relative; z-index: 1; display: grid; gap: 14px; padding-block: 120px 32px; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(38px, 7vw, 64px); letter-spacing: -.02em; line-height: 1.02; }
.hero p { font-size: 16px; max-width: 46ch; opacity: .95; }
.counts { display: flex; flex-wrap: wrap; gap: 10px; }
.count { background: rgba(255,255,255,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 10px 14px; display: grid; }
.count b { font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.count span { font-size: 12px; opacity: .9; }

.dests { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding-top: 32px; }
.dest { display: grid; gap: 12px; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
.photo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r); overflow: hidden; }
.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.photo .badge { position: absolute; top: 12px; left: 12px; background: #ffffff; color: #1b2424; font-weight: 700; font-size: 12.5px; padding: 6px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.dest .meta { display: grid; gap: 6px; }
.dest .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.dest:hover .photo { filter: brightness(1.05); }
.dest:focus-visible, .navbtn:focus-visible, .sub button:focus-visible, .chip:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.dest .go { font-weight: 700; color: var(--accent); font-size: 14px; }

.journey { display: grid; }
.leg { display: grid; grid-template-columns: 96px 18px 1fr; gap: 12px; align-items: stretch; }
.leg .when { font-size: 13px; font-weight: 700; text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
.leg .rail { position: relative; min-height: 54px; }
.leg .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.leg:first-child .rail::before { top: 8px; }
.leg:last-child .rail::before { bottom: auto; height: 8px; }
.leg .rail i { position: absolute; left: 3px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--muted); }
.leg.wales .rail i { border-color: var(--moss); }
.leg.mru .rail i { border-color: var(--accent); }
.leg.home .rail i { border-color: var(--sun); }
.leg .what { padding-bottom: 18px; display: grid; gap: 2px; min-width: 0; }

.banner { position: relative; overflow: hidden; border-radius: 0 0 28px 28px; min-height: 220px; display: grid; align-items: end; color: #ffffff; }
.banner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,25,25,0) 30%, rgba(10,25,25,.55) 100%); }
.banner .inner { position: relative; z-index: 1; padding-block: 80px 22px; display: grid; gap: 4px; }
.banner h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 5vw, 46px); }
.sub { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar)); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
.sub .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
.sub .wrap::-webkit-scrollbar { display: none; }
.sub button { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.sub button svg { width: 16px; height: 16px; }
.sub button:hover { background: var(--surface); color: var(--fg); }
.sub button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.page { padding-top: 28px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel.raised { box-shadow: var(--shadow); border-color: transparent; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.bar { height: 8px; background: var(--surface); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.facts span { display: inline-flex; gap: 5px; align-items: center; }
.facts svg { width: 15px; height: 15px; flex: none; }
.note { font-size: 13.5px; background: var(--sun-soft); color: var(--fg); border-radius: 12px; padding: 10px 14px; }
.note.tip { background: var(--accent-soft); }
.note.moss { background: var(--moss-soft); }
.linkrow { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; }
.kv { display: grid; grid-template-columns: minmax(100px, auto) 1fr; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.now { background: var(--coral-soft); color: var(--coral); }
.pill.before { background: var(--sun-soft); color: var(--sun); }
.pill.day { background: var(--accent-soft); color: var(--accent); }
.pill.wales { background: var(--moss-soft); color: var(--moss); }
.pill.mru { background: var(--accent-soft); color: var(--accent); }
.pill.grey { background: var(--surface); color: var(--muted); }

.days { display: grid; gap: 14px; }
.day { display: grid; grid-template-columns: 60px 1fr; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.day.changed { border-color: var(--accent); }
.day.travel { background: var(--surface); }
.date { display: grid; justify-items: center; align-content: start; }
.date .dow { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.date .num { font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.date .mon { font-size: 12px; color: var(--muted); }
.day-body { display: grid; gap: 10px; min-width: 0; }
.day-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.slots { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 90px 1fr; gap: 10px; font-size: 14px; }
.slot b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 2px; }
@media (max-width: 480px) { .day { grid-template-columns: 1fr; gap: 8px; } .date { justify-items: start; grid-auto-flow: column; justify-content: start; gap: 6px; align-items: baseline; } .date .num { font-size: 20px; } .slot { grid-template-columns: 1fr; gap: 0; } .leg { grid-template-columns: 78px 18px 1fr; } }

.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { appearance: none; border: 0; background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 13.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.checklist { display: grid; }
.check { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: 0; padding-top: 0; }
.check input { appearance: none; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 7px; margin: 1px 0 0; cursor: pointer; display: grid; place-items: center; background: var(--card); }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.check .txt { display: grid; gap: 2px; min-width: 0; }
.check .t { font-weight: 600; }
.check.is-done .t { text-decoration: line-through; color: var(--muted); }
.check .d { font-size: 13px; color: var(--muted); }
.glance { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.glance:first-child { border-top: 0; padding-top: 0; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 200px; flex: 1; }
.progress .bar { flex: 1; }

.act { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; min-width: 0; }
.act .strip { height: 8px; }
.act .body { padding: 16px 18px 18px; display: grid; gap: 10px; }
.act .top-row { display: flex; justify-content: space-between; gap: 8px; align-items: start; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; vertical-align: middle; }
tfoot td { font-weight: 800; border-bottom: 0; }
.money { width: 96px; font: inherit; font-variant-numeric: tabular-nums; text-align: right; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
.money:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.place { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; background: var(--card); }
.place a { font-size: 13px; font-weight: 600; }
.app { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; background: var(--card); }
.app .use { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.stay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .stay { grid-template-columns: 1fr; } }
.amen { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; font-size: 14px; }
.amen span { display: flex; gap: 8px; align-items: center; }
.amen svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.btn { display: inline-flex; align-items: center; justify-self: start; gap: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 10px; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
.fuel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fuel-field { display: grid; gap: 4px; }
.fuel-field .money { width: 100%; text-align: left; }
.btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .page, .home { animation: fade .25s ease; } @keyframes fade { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Honeymoon home">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 27s-10-6.2-10-13.2A5.8 5.8 0 0 1 16 10a5.8 5.8 0 0 1 10 3.8C26 20.8 16 27 16 27Z" fill="currentColor"/><path d="M8 19c3-1.6 5-1.6 8 0s5 1.6 8 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      honeymoon
    </a>
    <nav class="mainnav" id="topNav" aria-label="Main"></nav>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Connecting…</span></div>
  </div>
</header>
<nav class="bottom" id="bottomNav" aria-label="Main"></nav>
<main id="main"></main>

<script>
/* ================= Icons & helpers ================= */
const ICONS = {
  home: '<path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  wales: '<path d="M2 19 8.5 9l4 6 3-4L22 19z"/><circle cx="17" cy="6" r="2"/>',
  mauritius: '<path d="M3 17c2.5-1.6 4.5-1.6 7 0s4.5 1.6 7 0 3.5-1 4-1M3 21c2.5-1.6 4.5-1.6 7 0s4.5 1.6 7 0 3.5-1 4-1"/><circle cx="12" cy="9" r="4"/>',
  budget: '<circle cx="12" cy="12" r="9"/><path d="M14.5 8.5c-.5-1-1.5-1.5-2.5-1.5-1.7 0-3 1-3 2.3 0 3 5.5 1.7 5.5 4.6 0 1.3-1.3 2.3-3 2.3-1.1 0-2.2-.6-2.6-1.6M12 5.5V7M12 17v1.5"/>',
  overview: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  itinerary: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  activities: '<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  food: '<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1-3 4-3 8h3"/>',

/* ================= State: shared store when hosted on Claude, this device otherwise ================= */
const state = { checks: {}, budget: {}, plan: 'suggested' };
let docRef = null, docExists = false, mode = 'connecting';
const LS = 'honeymoon-state-v1';
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) Object.assign(state, s); } catch (e) {}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
let pending = {}, timer = null, writing = false;
function queue(patch) {
  for (const k in patch) {
    if (typeof patch[k] === 'object' && patch[k] !== null) {
      pending[k] = pending[k] || {};
      for (const j in patch[k]) pending[k][j] = (typeof patch[k][j] === 'object' && patch[k][j] !== null) ? Object.assign({}, pending[k][j], patch[k][j]) : patch[k][j];
    } else pending[k] = patch[k];
  }
  saveLocal();
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush() {
  if (!docRef || writing || !Object.keys(pending).length) return;
  writing = true;
  const patch = pending; pending = {};
  try {
    if (docExists) await docRef.update(patch);
    else { await docRef.set(JSON.parse(JSON.stringify(state))); docExists = true; }
    setSync('ok');
  } catch (e) { setSync(e && e.code === 'invalid_argument' ? 'readonly' : 'local'); }
  writing = false;
  if (Object.keys(pending).length) flush();
}
function setSync(m) {
  mode = m;
  const el = document.getElementById('sync');
  el.className = 'sync ' + (m === 'ok' ? 'ok' : m === 'connecting' ? '' : 'local');
  document.getElementById('syncText').textContent = m === 'ok' ? 'Saved for both of you' : m === 'connecting' ? 'Connecting…' : m === 'readonly' ? 'View only' : 'Saved on this device';
}
async function connect() {
  if (!(window.claude && window.claude.use)) { setSync('local'); return; }
  const t = setTimeout(() => { if (mode === 'connecting') setSync('local'); }, 10000);
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { clearTimeout(t); setSync('local'); return; }
  docRef = db.doc('trip/state');
  docRef.onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(t); if (mode === 'connecting') setSync('ok'); }
    if (!snap.exists) return;
    docExists = true;
    const d = snap.data() || {};
    state.checks = Object.assign({}, d.checks || {}, pending.checks || {});
    state.budget = JSON.parse(JSON.stringify(d.budget || {}));
    if (pending.budget) for (const k in pending.budget) state.budget[k] = Object.assign({}, state.budget[k], pending.budget[k]);
    state.plan = pending.plan || d.plan || state.plan;
    saveLocal();
    render(true);
  }, () => { clearTimeout(t); setSync('local'); });
}

/* ================= Building blocks ================= */
const isChecked = (id) => !!state.checks[id];
function checkItem(id, title, desc, extra) {
  const on = isChecked(id);
  return `<label class="check${on ? ' is-done' : ''}" for="c-${id}"><input type="checkbox" id="c-${id}" data-check="${id}" ${on ? 'checked' : ''}>
    <span class="txt"><span class="t">${esc(title)}</span>${desc ? `<span class="d">${esc(desc)}</span>` : ''}</span><span>${extra || ''}</span></label>`;
}
function progress(ids, label) {
  const done = ids.filter(isChecked).length, pct = ids.length ? Math.round(done / ids.length * 100) : 0;
  return `<div class="progress"><span>${done} of ${ids.length} ${label}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
const factRow = (arr) => arr && arr.length ? `<div class="facts">${arr.map(([i, t]) => `<span>${ic(i)}${esc(t)}</span>`).join('')}</div>` : '';
const FUEL_DEFAULT = { trip: 400, local: 80, mpg: 45, ppl: 1.40 };
function fuel() { return Object.assign({}, FUEL_DEFAULT, state.budget.fuelcalc || {}); }
function fuelCost() { const f = fuel(); const miles = (+f.trip || 0) + (+f.local || 0); return f.mpg > 0 ? miles / f.mpg * 4.546 * (+f.ppl || 0) : 0; }
function budgetRows(trip) {
  return BUDGET_ROWS.filter(r => !trip || r[4] === trip).map(([k, name, cost, paid, tr]) => { const o = state.budget[k] || {}; return { k, name, tr, cost: k === 'walesfuel' ? Math.round(fuelCost()) : (o.cost ?? cost), paid: o.paid ?? paid, fixed: k === 'walesfuel' }; });
}
const sum = (rows, f) => rows.reduce((a, r) => a + (+r[f] || 0), 0);
const todoIds = (trip) => trip === 'wales' ? WALES_TODO.map(t => t.id) : MRU_TODO.map(t => 'b-' + t.id);
function dayCard(d, extra) {
  return `<article class="day${d.changed ? ' changed' : ''}${d.travel ? ' travel' : ''}"><div class="date"><span class="dow">${d.dow}</span><span class="num">${d.num}</span><span class="mon">${d.mon}</span></div>
    <div class="day-body"><div class="day-title"><h3>${esc(d.title)}</h3>${d.weather ? '<span class="pill before">Weather-dependent</span>' : ''}${d.travel ? '<span class="pill grey">Travel</span>' : ''}</div>
    ${d.slots && d.slots.length ? `<div class="slots">${d.slots.map(([k, v]) => `<div class="slot"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
    ${factRow(d.facts)}${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}
    ${d.q ? `<div class="linkrow"><a href="${maps(d.q)}" target="_blank" rel="noopener">Open in Maps</a></div>` : ''}${extra || ''}</div></article>`;
}

function budgetTable(rows, groups) {
  const cost = sum(rows, 'cost'), paid = sum(rows, 'paid');
  const line = (r) => `<tr><td>${esc(r.name)}</td>

    <td class="num"><input class="money" id="paid-${r.k}" inputmode="decimal" data-b="${r.k}" data-f="paid" value="${r.paid}" aria-label="${esc(r.name)} paid"></td>
    <td class="num" id="left-${r.k}">${gbp(r.cost - r.paid)}</td></tr>`;
  const body = groups ? groups.map(([tr, label]) => `<tr><td colspan="4" class="eyebrow" style="padding-top:18px">${label}</td></tr>` + rows.filter(r => r.tr === tr).map(line).join('')).join('') : rows.map(line).join('');
  return `<div class="stat-row"><div class="stat"><span class="muted small">Total</span><b data-tot="cost">${gbp(cost)}</b></div><div class="stat"><span class="muted small">Paid</span><b data-tot="paid">${gbp(paid)}</b></div><div class="stat"><span class="muted small">Still to pay</span><b data-tot="left">${gbp(cost - paid)}</b></div></div>
    <div class="panel"><div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Cost (£)</th><th class="num">Paid (£)</th><th class="num">Left</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>Total</td><td class="num" data-tot="cost">${gbp(cost)}</td><td class="num" data-tot="paid">${gbp(paid)}</td><td class="num" data-tot="left">${gbp(cost - paid)}</td></tr></tfoot></table></div></div>`;
}

/* ================= Router ================= */
const NAV = [['home', 'Home'], ['wales', 'Wales'], ['mauritius', 'Mauritius'], ['budget', 'Budget']];
let cur = { page: 'home', sec: '' };
function parseHash() {
  const h = (location.hash || '').slice(1);
  if (h === 'budget') return { page: 'budget', sec: '' };
  const m = h.match(/^(wales|mauritius)(?:-([a-z]+))?$/);
  if (m) { const sec = m[2] || 'overview'; return { page: m[1], sec: SECTIONS[m[1]].some(s => s[0] === sec) ? sec : 'overview' }; }
  return { page: 'home', sec: '' };
}
function renderNav() {
  const html = NAV.map(([id, label]) => `<button type="button" class="navbtn" data-go="${id}" aria-current="${cur.page === id}">${ic(id)}<span>${label}</span></button>`).join('');
  document.getElementById('topNav').innerHTML = html;
  document.getElementById('bottomNav').innerHTML = html;
}
function render(fromSync) {
  if (fromSync && document.activeElement && document.activeElement.classList.contains('money')) { refreshTotals(); return; }
  const y = window.scrollY;
  renderNav();
  document.getElementById('main').innerHTML = cur.page === 'wales' ? walesPage(cur.sec) : cur.page === 'mauritius' ? mruPage(cur.sec) : cur.page === 'budget' ? viewBudget() : viewHome();
  if (fromSync) window.scrollTo(0, y);
}
function route() {
  const next = parseHash();
  const samePage = next.page === cur.page;
  cur = next;
  render(false);
  if (!samePage) window.scrollTo(0, 0);
  else { const banner = document.querySelector('.banner'); if (banner && window.scrollY > banner.offsetHeight) window.scrollTo(0, banner.offsetHeight); }
  const active = document.querySelector('.sub button[aria-current="true"]'); if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); if (location.hash.slice(1) === go.dataset.go) route(); else location.hash = go.dataset.go; return; }
  const p = e.target.closest('[data-plan]');
  if (p) { state.plan = p.dataset.plan; queue({ plan: state.plan }); render(true); return; }
  const a = e.target.closest('[data-area]');
  if (a) { placeFilter = a.dataset.area; render(true); return; }
  if (e.target.id === 'clearShop') {
    const patch = {}; WALES_SHOP.forEach(g => g.items.forEach(i => { const id = 's-' + slug(i); if (state.checks[id]) { state.checks[id] = false; patch[id] = false; } }));
    queue({ checks: patch }); render(true);
  }
});
document.addEventListener('change', (e) => {
  const c = e.target.closest('[data-check]');
  if (c) { const id = c.dataset.check; state.checks[id] = c.checked; queue({ checks: { [id]: c.checked } }); render(true); }
});
function refreshTotals() {
  const rows = budgetRows();
  rows.forEach(r => { const el = document.getElementById('left-' + r.k); if (el) el.textContent = gbp(r.cost - r.paid); });
  const fc = document.getElementById('cost-walesfuel'); if (fc && fc.tagName === 'SPAN') fc.textContent = gbp(Math.round(fuelCost()));
  const fo = document.getElementById('fuelOut'); if (fo) fo.textContent = gbp(fuelCost());
  const scope = cur.page === 'wales' ? 'wales' : cur.page === 'mauritius' ? 'mru' : null;
  const shown = budgetRows(scope); const cost = sum(shown, 'cost'), paid = sum(shown, 'paid');
  document.querySelectorAll('[data-tot]').forEach(el => { el.textContent = gbp(el.dataset.tot === 'cost' ? cost : el.dataset.tot === 'paid' ? paid : cost - paid); });
}
document.addEventListener('input', (e) => {
  const num = (x) => { const v = parseFloat(String(x).replace(/[£,\s]/g, '')); return isNaN(v) ? 0 : v; };
  const fl = e.target.closest('[data-fuel]');
  if (fl) { const k = fl.dataset.fuel, val = num(fl.value); state.budget.fuelcalc = Object.assign({}, state.budget.fuelcalc, { [k]: val }); queue({ budget: { fuelcalc: { [k]: val } } }); refreshTotals(); return; }
  const m = e.target.closest('[data-b]'); if (!m) return;
  const k = m.dataset.b, f = m.dataset.f, val = num(m.value);
  state.budget[k] = Object.assign({}, state.budget[k], { [f]: val });
  queue({ budget: { [k]: { [f]: val } } });
  refreshTotals();
});
window.addEventListener('hashchange', route);
route();
connect();
</script>

</body>
</html>
