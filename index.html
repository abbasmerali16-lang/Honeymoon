<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sabira & Abbas' Honeymoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  color-scheme: light;
  --bg: #E9D9C3; --surface: #DFCBB0; --card: #F8EFE3; --fg: #33261F; --muted: #7D6B5F; --line: #D8C2A5;
  --accent: #B4533F; --accent-soft: #F2D3C6; --gold: #B98428; --gold-soft: #F1DFBC;
  --wales: #5D7A4C; --wales-soft: #DCE4CF; --mru: #C46A45; --mru-soft: #F3D6C4;
  --shadow: 0 1px 2px rgba(70,40,20,.06), 0 8px 24px rgba(70,40,20,.08);
  --r: 18px; --serif: 'Fraunces', Georgia, serif; --sans: 'Nunito Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: light; --bg: #E9D9C3; --fg: #33261F; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
img { display: block; max-width: 100%; }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: clamp(34px, 6vw, 60px); }
h2 { font-size: clamp(22px, 3vw, 28px); }
h3 { font-size: 19px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 28px; } }
.muted { color: var(--muted); } .small { font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 16px; align-content: start; }
.grid2 { display: grid; gap: 18px; } .grid3 { display: grid; gap: 18px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
.view { animation: fade .35s ease both; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

/* Header */
header.top { position: sticky; top: 0; z-index: 30; background: rgba(233,217,195,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); font-family: var(--serif); font-size: 20px; font-weight: 600; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.mainnav { display: none; gap: 4px; margin-left: auto; }
@media (min-width: 760px) { .mainnav { display: flex; } }
.navbtn { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 9px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
.navbtn svg { width: 18px; height: 18px; }
.navbtn:hover { background: var(--surface); color: var(--fg); }
.navbtn[aria-current="true"] { background: var(--fg); color: var(--bg); }
.sync { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (min-width: 760px) { .sync { margin-left: 8px; } }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.sync.ok .dot { background: var(--wales); } .sync.local .dot { background: var(--muted); }
nav.bottom { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: rgba(248,239,227,.97); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.bottom .navbtn { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 10px; border-radius: 12px; }
nav.bottom .navbtn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 760px) { nav.bottom { display: none; } }
main { padding-bottom: 90px; } @media (min-width: 760px) { main { padding-bottom: 40px; } }

/* Photos */
.ph { position: relative; overflow: hidden; background: linear-gradient(135deg, #E9CDB5, #D99A79 60%, #B4533F); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.wales-bg { background: linear-gradient(135deg, #C9D5BC, #7E956C); }
.shade::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,18,10,.05) 30%, rgba(30,18,10,.62)); pointer-events: none; }

/* Home hero */
.hero { position: relative; display: grid; grid-template-rows: 1fr 1fr; height: min(88vh, 720px); min-height: 520px; }
@media (min-width: 760px) { .hero { grid-template-rows: none; grid-template-columns: 1fr 1fr; } }
.hero .ph { height: 100%; }
.hero .shade::after { background: linear-gradient(180deg, rgba(30,18,10,0) 55%, rgba(30,18,10,.45)); }
@media (max-width: 759px) { .hero .ph .lbl { display: none; } }
.hero .ph .lbl { position: absolute; z-index: 2; left: 16px; bottom: 14px; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
@media (min-width: 760px) { .hero .ph .lbl { left: 24px; bottom: 22px; } .hero .ph + .ph .lbl { left: auto; right: 24px; } }
.hero .center { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
.hero .card { pointer-events: auto; text-align: center; background: rgba(248,239,227,.95); border-radius: 26px; padding: 26px 22px 22px; box-shadow: 0 20px 60px rgba(40,20,10,.25); max-width: 560px; width: 100%; }
@media (min-width: 760px) { .hero .card { padding: 38px 44px 30px; } }
.hero h1 { font-size: clamp(32px, 5.4vw, 54px); }
.hero h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
.hero p.lead { margin: 12px auto 0; color: var(--muted); max-width: 420px; }
.counts { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
@media (max-width: 480px) { .count b { font-size: 24px; } .count span { font-size: 12px; } .count { padding: 8px; } }
.count { flex: 1; max-width: 170px; border-radius: 14px; padding: 10px 12px; }
.count.w { background: var(--wales-soft); color: var(--wales); } .count.g { background: var(--gold-soft); color: #7A5512; } .count.m { background: var(--mru-soft); color: var(--mru); }
.count b { display: block; font-family: var(--serif); font-size: 30px; line-height: 1.1; }
.count span { font-size: 13px; font-weight: 700; }

/* Cards */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; }
@media (min-width: 760px) { .panel { padding: 24px; } }
.panel.raised { box-shadow: var(--shadow); border-color: transparent; }
.sect { margin-top: 44px; display: grid; gap: 18px; }
.head { display: grid; gap: 6px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--surface); color: var(--muted); }
.pill.wales, .pill.day { background: var(--wales-soft); color: var(--wales); }
.pill.mru { background: var(--mru-soft); color: var(--mru); }
.pill.now { background: var(--accent-soft); color: var(--accent); }
.pill.before { background: var(--gold-soft); color: #8C6118; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; background: var(--accent); color: #fff; font-weight: 800; padding: 11px 18px; border-radius: 12px; text-decoration: none; font-size: 15px; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--surface); color: var(--fg); }
.btn svg { width: 18px; height: 18px; }
.linkrow { display: flex; flex-wrap: wrap; gap: 10px; }
.more { font-weight: 800; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; font-size: 15px; }
.more svg { width: 16px; height: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--surface); padding: 5px 10px; border-radius: 999px; }
.facts svg { width: 15px; height: 15px; color: var(--accent); }

/* Destination cards (home) */
.dests { display: grid; gap: 20px; margin-top: 40px; }
@media (min-width: 760px) { .dests { grid-template-columns: 1fr 1fr; } }
.dest { text-align: left; border: 0; padding: 0; cursor: pointer; background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); display: grid; transition: transform .2s; }
.dest:hover { transform: translateY(-3px); }
.dest .ph { aspect-ratio: 16/10; }
.dest .badge { position: absolute; z-index: 2; top: 14px; left: 14px; background: rgba(255,251,245,.94); font-weight: 800; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
.dest .meta { padding: 18px 20px 22px; display: grid; gap: 10px; }
.progress { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.bar { height: 7px; background: var(--surface); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Journey */
.journey { display: grid; }
.leg { display: grid; grid-template-columns: 96px 20px 1fr; gap: 10px; }
.leg .when { font-size: 13px; font-weight: 800; color: var(--muted); padding-top: 2px; text-align: right; }
.leg .rail { position: relative; display: flex; justify-content: center; }
.leg .rail::before { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.leg:first-child .rail::before { top: 8px; } .leg:last-child .rail::before { bottom: calc(100% - 10px); }
.leg .rail i { position: relative; margin-top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); border: 3px solid var(--card); box-sizing: content-box; }
.leg.wales .rail i { background: var(--wales); } .leg.mru .rail i { background: var(--mru); } .leg.home .rail i { background: var(--muted); } .leg.gold .rail i { background: var(--gold); }
.leg .what { display: grid; padding-bottom: 18px; }

/* Picks strip */
.picks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.picks > * { scroll-snap-align: start; }

/* Activity cards */
.xcard { display: grid; text-decoration: none; color: inherit; background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s; }
.xcard:hover { transform: translateY(-3px); }
.xcard .ph { aspect-ratio: 3/2; }
.xcard .tag { position: absolute; z-index: 2; top: 12px; left: 12px; }
.xcard .tag .pill { background: rgba(255,251,245,.95); color: var(--fg); }
.xcard .tag .pill.top { background: var(--accent); color: #fff; }
.xcard .body { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; }
.xcard .when { font-size: 13px; font-weight: 800; color: var(--accent); }
.xcard .done { position: absolute; z-index: 2; top: 12px; right: 12px; background: var(--wales); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }

/* Banner + sub nav */
.banner { position: relative; height: 260px; }
@media (min-width: 760px) { .banner { height: 340px; } }
.banner .ph { position: absolute; inset: 0; }
.banner .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 26px; color: #fff; }
.banner .inner .eyebrow { color: rgba(255,255,255,.9); }
.banner h1 { color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.3); }
nav.sub { position: sticky; top: 64px; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.sub .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 8px; padding-bottom: 8px; }
nav.sub .wrap::-webkit-scrollbar { display: none; }
nav.sub button { display: flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 8px 13px; border-radius: 999px; font-weight: 700; color: var(--muted); white-space: nowrap; font-size: 15px; }
nav.sub button svg { width: 17px; height: 17px; }
nav.sub button:hover { background: var(--surface); color: var(--fg); }
nav.sub button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.page { padding-top: 28px; display: grid; gap: 22px; }

/* Stay */
.stay { display: grid; gap: 0; background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
@media (min-width: 860px) { .stay { grid-template-columns: 1.1fr 1fr; } }
.stay .ph { min-height: 240px; }
.gallery { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 30%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.gallery .ph { aspect-ratio: 4/3; border-radius: 14px; scroll-snap-align: start; }
.gallery .ph::after { display: none; }
.stay .panel { border: 0; border-radius: 0; }
.amen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amen span { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.amen svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; margin: 0; font-size: 15px; }
dl.kv dt { font-weight: 800; color: var(--muted); } dl.kv dd { margin: 0; }
@media (max-width: 480px) { dl.kv { grid-template-columns: 1fr; gap: 2px; } dl.kv dd { margin-bottom: 10px; } }
.note { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note.tip { background: var(--wales-soft); }

/* Rhythm */
.rhythm { display: grid; gap: 10px; }
@media (min-width: 760px) { .rhythm { grid-template-columns: repeat(7, 1fr); } }
.rhythm div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.rhythm b { font-family: var(--serif); font-size: 20px; color: var(--wales); }

/* Days */
.days { display: grid; gap: 18px; }
.day { display: grid; background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
@media (min-width: 760px) { .day { grid-template-columns: 280px 1fr; } }
.day .ph { aspect-ratio: 16/9; } @media (min-width: 760px) { .day .ph { aspect-ratio: auto; min-height: 100%; } }
.day .datechip { position: absolute; z-index: 2; top: 12px; left: 12px; background: rgba(255,251,245,.95); border-radius: 12px; padding: 6px 12px; text-align: center; line-height: 1.1; }
.day .datechip b { display: block; font-family: var(--serif); font-size: 26px; }
.day .datechip span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.day .body { padding: 18px 20px 20px; display: grid; gap: 12px; align-content: start; }
.day.changed { outline: 2px solid var(--gold); outline-offset: -2px; }
.day-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.slots { display: grid; gap: 0; }
.slot { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 15px; }
.slot:first-child { border-top: 0; }
.slot.pray { background: var(--gold-soft); border-radius: 10px; border-top-color: transparent; padding: 7px 10px; margin: 2px -10px; }
.slot.pray + .slot { border-top-color: transparent; }
.slot.pray b, .slot.pray span { color: #7A5512; }
.prayers { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
.prayers b { color: #7A5512; }
.slot b { color: var(--accent); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* Checklists */
.checklist { display: grid; }
.check { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.checklist > .check:first-child { border-top: 0; }
.check input { appearance: none; width: 22px; height: 22px; margin: 1px 0 0; border: 2px solid #CDB9A5; border-radius: 7px; display: grid; place-items: center; cursor: pointer; background: var(--card); }
.check input:checked { background: var(--wales); border-color: var(--wales); }
.check input:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check input:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.check .txt { display: grid; gap: 2px; }
.check .t { font-weight: 700; }
.check .d { font-size: 14px; color: var(--muted); }
.check.is-done .t { text-decoration: line-through; color: var(--muted); }
.check .side { display: flex; gap: 8px; align-items: center; }
.check .side a { font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
tfoot td { font-weight: 800; border-bottom: 0; }
.meals td:first-child { font-weight: 800; white-space: nowrap; }
input.money { width: 92px; text-align: right; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; }
.stat b { font-family: var(--serif); font-size: clamp(20px, 3vw, 26px); }
.fuel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 760px) { .fuel-grid { grid-template-columns: repeat(4, 1fr); } }
.fuel-field { display: grid; gap: 4px; } .fuel-field input { width: 100%; text-align: left; }

/* Places, apps, chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.places { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.place { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.place a { font-size: 14px; font-weight: 800; text-decoration: none; margin-top: 4px; }
.app { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.app .use { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.app a { font-weight: 800; text-decoration: none; font-size: 14px; }

/* Detail page */
.dhero { position: relative; height: 340px; } @media (min-width: 760px) { .dhero { height: 440px; } }
.dhero .ph { position: absolute; inset: 0; }
.dhero .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding-top: 18px; padding-bottom: 28px; color: #fff; }
.dhero h1 { color: #fff; font-size: clamp(30px, 5vw, 50px); text-shadow: 0 2px 16px rgba(0,0,0,.3); max-width: 800px; }
.dhero .lead { color: rgba(255,255,255,.92); max-width: 640px; margin-top: 10px; font-size: 17px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,251,245,.94); color: var(--fg); border: 0; border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 800; cursor: pointer; font-size: 14px; }
.back svg { width: 18px; height: 18px; }
.dgrid { display: grid; gap: 22px; margin-top: 28px; }
@media (min-width: 900px) { .dgrid { grid-template-columns: 1fr 360px; align-items: start; } .dgrid .aside { position: sticky; top: 84px; } }
.dsec { display: grid; gap: 10px; }
.dsec ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.dsec h2 { font-size: 22px; }
.bring { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); list-style: none; padding: 0 !important; }
.bring li { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.bring li svg { width: 18px; height: 18px; color: var(--wales); flex: none; margin-top: 2px; }
.aside .row { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.aside .row:first-of-type { border-top: 0; }
.aside .row b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Footer */
footer { border-top: 1px solid var(--line); margin-top: 56px; padding: 22px 0 10px; font-size: 14px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
.credits { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.credit { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; font-size: 13px; }
.credit .ph { width: 72px; height: 54px; border-radius: 8px; }
.credit a { word-break: break-word; }
[hidden] { display: none !important; }

/* ================= State: shared store when hosted on Claude, this device otherwise ================= */
const state = { checks: {}, budget: {}, plan: 'suggested' };
let docRef = null, docExists = false, mode = 'connecting';
const LS = 'honeymoon-state-v1';
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) Object.assign(state, s); } catch (e) {}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
let pending = {}, timer = null, writing = false;
function queue(patch) {
  for (const k in patch) {
    if (typeof patch[k] === 'object' && patch[k] !== null) {
      pending[k] = pending[k] || {};
      for (const j in patch[k]) pending[k][j] = (typeof patch[k][j] === 'object' && patch[k][j] !== null) ? Object.assign({}, pending[k][j], patch[k][j]) : patch[k][j];
    } else pending[k] = patch[k];
  }
  saveLocal();
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush() {
  if (!docRef || writing || !Object.keys(pending).length) return;
  writing = true;
  const patch = pending; pending = {};
  try {
    if (docExists) await docRef.update(patch);
    else { await docRef.set(JSON.parse(JSON.stringify(state))); docExists = true; }
    setSync('ok');
  } catch (e) { setSync(e && e.code === 'invalid_argument' ? 'readonly' : 'local'); }
  writing = false;
  if (Object.keys(pending).length) flush();
}
function setSync(m) {
  mode = m;
  const el = document.getElementById('sync');
  el.className = 'sync ' + (m === 'ok' ? 'ok' : m === 'connecting' ? '' : 'local');
  document.getElementById('syncText').textContent = m === 'ok' ? 'Saved for both of you' : m === 'connecting' ? 'Connecting…' : m === 'readonly' ? 'View only' : 'Saved on this device';
}
async function connect() {
  if (!(window.claude && window.claude.use)) { setSync('local'); return; }
  const t = setTimeout(() => { if (mode === 'connecting') setSync('local'); }, 10000);
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { clearTimeout(t); setSync('local'); return; }
  docRef = db.doc('trip/state');
  docRef.onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(t); if (mode === 'connecting') setSync('ok'); }
    if (!snap.exists) return;
    docExists = true;
    const d = snap.data() || {};
    state.checks = Object.assign({}, d.checks || {}, pending.checks || {});
    state.budget = JSON.parse(JSON.stringify(d.budget || {}));
    if (pending.budget) for (const k in pending.budget) state.budget[k] = Object.assign({}, state.budget[k], pending.budget[k]);
    state.plan = pending.plan || d.plan || state.plan;
    saveLocal();
    render(true);
  }, () => { clearTimeout(t); setSync('local'); });
}

}

    <td class="num" id="left-${r.k}">${gbp(r.cost - r.paid)}</td></tr>`;
  const body = groups ? groups.map(([tr, label]) => `<tr><td colspan="4" class="eyebrow" style="padding-top:18px">${label}</td></tr>` + rows.filter(r => r.tr === tr).map(line).join('')).join('') : rows.map(line).join('');
  return `<div class="stat-row"><div class="stat"><span class="muted small">Total</span><b data-tot="cost">${gbp(cost)}</b></div><div class="stat"><span class="muted small">Paid</span><b data-tot="paid">${gbp(paid)}</b></div><div class="stat"><span class="muted small">Still to pay</span><b data-tot="left">${gbp(cost - paid)}</b></div></div>

}

/* ================= Router ================= */
const cameFrom = {};       // detail key -> the page it was opened from
const scrollMem = {};      // page -> last scroll position
let lastHash = null, backNav = false;
function labelFor(h) {
  if (!h || h === 'home') return 'Home';
  if (h === 'budget') return 'Budget';
  if (h === 'credits') return 'Photo credits';
  if (h === 'w-arrive') return 'Arriving at the barn';
  if (h === 'm-arrive') return 'Arriving at the villa';
  if (DETAIL[h]) return DETAIL[h].title;
  const m = h.match(/^(wales|mauritius)(?:-([a-z]+))?$/);
  if (m) { const sec = SECTIONS[m[1]].find(s => s[0] === (m[2] || 'overview')); return (m[1] === 'wales' ? 'Wales' : 'Mauritius') + ' ' + (sec ? sec[1].toLowerCase() : 'overview'); }
  return 'Back';
}
function backBtn(key, fallback, fallbackLabel) {
  const from = cameFrom[key];
  return `<button class="back" type="button" data-go-back="${from || fallback}">${ic('left')}Back to ${esc(from ? labelFor(from) : fallbackLabel)}</button>`;
}
const NAV = [['home', 'Home'], ['wales', 'Wales'], ['mauritius', 'Mauritius'], ['budget', 'Budget']];
let cur = { page: 'home', sec: '' };
function parseHash() {
  const h = (location.hash || '').slice(1);
  if (h === 'budget' || h === 'credits') return { page: h, sec: '' };
  if (DETAIL[h]) return { page: 'detail', sec: h, nav: DETAIL[h].trip };
  if (h === 'w-arrive' || h === 'm-arrive') return { page: 'arrive', sec: h, nav: h[0] === 'w' ? 'wales' : 'mauritius' };
  const m = h.match(/^(wales|mauritius)(?:-([a-z]+))?$/);
  if (m) { const sec = m[2] || 'overview'; return { page: m[1], sec: SECTIONS[m[1]].some(s => s[0] === sec) ? sec : 'overview' }; }
  return { page: 'home', sec: '' };
}
function renderNav() {
  const active = cur.nav || cur.page;
  const html = NAV.map(([id, label]) => `<button type="button" class="navbtn" data-go="${id}" aria-current="${active === id}">${ic(id)}<span>${label}</span></button>`).join('');
  document.getElementById('topNav').innerHTML = html;
  document.getElementById('bottomNav').innerHTML = html;
}
const footer = () => `<footer><div class="wrap"><span>Made with love for Sabira &amp; Abbas</span><a href="#credits" data-go="credits">Photo credits</a></div></footer>`;
function render(fromSync) {
  if (fromSync && document.activeElement && document.activeElement.classList.contains('money')) { refreshTotals(); return; }
  const y = window.scrollY;
  renderNav();
  const p = cur.page;
  document.getElementById('main').innerHTML = (p === 'wales' ? walesPage(cur.sec) : p === 'mauritius' ? mruPage(cur.sec) : p === 'budget' ? viewBudget() : p === 'detail' ? viewDetail(cur.sec) : p === 'arrive' ? viewArrive(cur.sec) : p === 'credits' ? viewCredits() : viewHome()) + footer();
  if (fromSync) window.scrollTo(0, y);
}
function route() {
  const h = (location.hash || '#home').slice(1) || 'home';
  if (lastHash !== null) scrollMem[lastHash] = window.scrollY;
  const next = parseHash();
  const isDetail = next.page === 'detail' || next.page === 'arrive';
  if (isDetail && !backNav && lastHash !== null && lastHash !== h) cameFrom[h] = lastHash;
  const returning = backNav || (lastHash !== null && cameFrom[lastHash] === h);
  backNav = false;
  const samePage = next.page === cur.page && !isDetail;
  cur = next; lastHash = h;
  render(false);
  if (returning && scrollMem[h] != null) window.scrollTo(0, scrollMem[h]);
  else if (!samePage) window.scrollTo(0, 0);
  else { const banner = document.querySelector('.banner'); if (banner && window.scrollY > banner.offsetHeight) window.scrollTo(0, banner.offsetHeight); }
  const active = document.querySelector('.sub button[aria-current="true"]'); if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}

document.addEventListener('click', (e) => {
  const bk = e.target.closest('[data-go-back]');
  if (bk) { e.preventDefault(); backNav = true; location.hash = bk.dataset.goBack; return; }
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('input')) { e.preventDefault(); if (location.hash.slice(1) === go.dataset.go) route(); else location.hash = go.dataset.go; return; }
  const p = e.target.closest('[data-plan]');
  if (p) { state.plan = p.dataset.plan; queue({ plan: state.plan }); render(true); return; }
  const a = e.target.closest('[data-area]');
  if (a) { placeFilter = a.dataset.area; render(true); return; }
  if (e.target.id === 'clearShop') {
    const patch = {}; WALES_SHOP.forEach(g => g.items.forEach(i => { const id = 's-' + slug(i); if (state.checks[id]) { state.checks[id] = false; patch[id] = false; } }));
    queue({ checks: patch }); render(true);
  }
});
document.addEventListener('change', (e) => {
  const c = e.target.closest('[data-check]');
  if (c) { const id = c.dataset.check; state.checks[id] = c.checked; queue({ checks: { [id]: c.checked } }); render(true); }
});
function refreshTotals() {
  budgetRows().forEach(r => { const el = document.getElementById('left-' + r.k); if (el) el.textContent = gbp(r.cost - r.paid); });
  const fc = document.getElementById('cost-walesfuel'); if (fc && fc.tagName === 'SPAN') fc.textContent = gbp(Math.round(fuelCost()));
  const fo = document.getElementById('fuelOut'); if (fo) fo.textContent = gbp(fuelCost());
  const scope = cur.page === 'wales' ? 'wales' : cur.page === 'mauritius' ? 'mru' : null;
  const shown = budgetRows(scope); const cost = sum(shown, 'cost'), paid = sum(shown, 'paid');
  document.querySelectorAll('[data-tot]').forEach(el => { el.textContent = gbp(el.dataset.tot === 'cost' ? cost : el.dataset.tot === 'paid' ? paid : cost - paid); });
}
document.addEventListener('input', (e) => {
  const num = (x) => { const v = parseFloat(String(x).replace(/[£,\s]/g, '')); return isNaN(v) ? 0 : v; };
  const fl = e.target.closest('[data-fuel]');
  if (fl) { const k = fl.dataset.fuel, val = num(fl.value); state.budget.fuelcalc = Object.assign({}, state.budget.fuelcalc, { [k]: val }); queue({ budget: { fuelcalc: { [k]: val } } }); refreshTotals(); return; }
  const m = e.target.closest('[data-b]'); if (!m) return;
  const k = m.dataset.b, f = m.dataset.f, val = num(m.value);
  state.budget[k] = Object.assign({}, state.budget[k], { [f]: val });
  queue({ budget: { [k]: { [f]: val } } });
  refreshTotals();
});
window.addEventListener('hashchange', route);
route();
connect();
</script>
